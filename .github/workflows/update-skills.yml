name: Update skills

# Opens a PR when a source in sources.txt has a new release. Nothing reaches cloud sessions until it's merged.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: update-skills

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump sources
        id: bump
        run: |
          scripts/bump-sources.sh | tee "$RUNNER_TEMP/changes.txt"
          if git diff --quiet sources.txt; then
            echo "All sources on their latest release"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch="update-skills/$(sha256sum sources.txt | cut -c1-12)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "PR branch $branch already exists"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Copilot skills
        if: steps.bump.outputs.skip != 'true'
        run: scripts/build-copilot-skills.sh

      - name: Open PR
        if: steps.bump.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Update skill sources" -m "$(cat "$RUNNER_TEMP/changes.txt")"
          git push origin "$BRANCH"
          { echo 'Source updates:'; echo; sed 's/^/- /' "$RUNNER_TEMP/changes.txt"; echo
            echo 'Review the skill changes before merging: once merged, new cloud sessions use them.'; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "Update skill sources" --body-file "$RUNNER_TEMP/body.md"
